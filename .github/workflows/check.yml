name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # The latest Claude Code, so a change in its plugin API shows up here.
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate .
      - run: claude plugin validate stage-toons
      - run: claude plugin test stage-toons
      - run: npx -y tsx --test "tools/frames/*.test.ts"
